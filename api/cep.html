<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEP Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #17171a;
    --border: #2a2a30;
    --accent: #00e5a0;
    --accent2: #ff4d6d;
    --accent3: #ffd166;
    --text: #e8e8ec;
    --muted: #6b6b78;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 2rem;
  }

  body::before {
    content: '';
    position: fixed;
    top: -40%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,229,160,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 3rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }

  .logo span {
    color: var(--accent);
  }

  .logo small {
    display: block;
    font-size: 0.75rem;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: 3px;
    font-weight: 400;
    margin-top: 4px;
  }

  .api-badge {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 2px;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
  }

  .tab {
    flex: 1;
    padding: 0.65rem 1rem;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .tab .method {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 2px;
  }

  .tab[data-tab="get"] .method { background: rgba(0,229,160,0.15); color: var(--accent); }
  .tab[data-tab="post"] .method { background: rgba(255,209,102,0.15); color: var(--accent3); }
  .tab[data-tab="delete"] .method { background: rgba(255,77,109,0.15); color: var(--accent2); }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.8rem;
    margin-bottom: 1.2rem;
  }

  .card-title {
    font-size: 0.7rem;
    font-family: var(--mono);
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 1.4rem;
    text-transform: uppercase;
  }

  /* Forms */
  .field {
    margin-bottom: 1rem;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-family: var(--mono);
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.9rem;
    padding: 0.65rem 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"]::placeholder { color: var(--muted); }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0.7rem 1.6rem;
    border: none;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }

  .btn:active { transform: scale(0.98); }

  .btn-get { background: var(--accent); color: var(--bg); }
  .btn-get:hover { background: #00ffb3; }

  .btn-post { background: var(--accent3); color: var(--bg); }
  .btn-post:hover { background: #ffe08a; }

  .btn-delete { background: var(--accent2); color: #fff; }
  .btn-delete:hover { background: #ff6b85; }

  /* Response area */
  .response-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.2rem;
    font-family: var(--mono);
    font-size: 0.82rem;
    line-height: 1.7;
    min-height: 80px;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .response-box.success { border-color: var(--accent); color: var(--accent); }
  .response-box.error { border-color: var(--accent2); color: var(--accent2); }
  .response-box.loading { color: var(--muted); }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status-dot.ok { background: var(--accent); }
  .status-dot.err { background: var(--accent2); }

  /* Result card for GET */
  .result-card {
    display: none;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.2rem 1.4rem;
    margin-top: 1rem;
  }

  .result-card.show { display: block; animation: fadeIn 0.3s ease; }

  .result-row {
    display: flex;
    gap: 1rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    align-items: flex-start;
  }

  .result-row:last-child { border-bottom: none; }

  .result-key {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    min-width: 90px;
    padding-top: 2px;
    letter-spacing: 1px;
  }

  .result-val { color: var(--text); font-weight: 600; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      CEP<span>.</span>API
      <small>GERENCIADOR DE ENDEREÇOS</small>
    </div>
    <div class="api-badge">REST · PHP · PDO</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="get">
      <span class="method">GET</span> Consultar
    </button>
    <button class="tab" data-tab="post">
      <span class="method">POST</span> Cadastrar
    </button>
    <button class="tab" data-tab="delete">
      <span class="method">DEL</span> Remover
    </button>
  </div>

  <!-- GET -->
  <div class="panel active" id="panel-get">
    <div class="card">
      <div class="card-title">// Consultar CEP</div>
      <div class="field">
        <label>CEP</label>
        <input type="text" id="get-cep" placeholder="00000-000" maxlength="9">
      </div>
      <button class="btn btn-get" onclick="doGet()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        BUSCAR
      </button>
    </div>

    <div class="card">
      <div class="card-title">// Resultado</div>
      <div id="get-result-card" class="result-card">
        <div id="get-result-rows"></div>
      </div>
      <div id="get-empty" class="empty-state">Nenhuma consulta realizada</div>
      <div id="get-status" class="status-line" style="display:none"></div>
    </div>
  </div>

  <!-- POST -->
  <div class="panel" id="panel-post">
    <div class="card">
      <div class="card-title">// Cadastrar novo CEP</div>
      <div class="field">
        <label>CEP</label>
        <input type="text" id="post-cep" placeholder="00000-000" maxlength="9">
      </div>
      <div class="field">
        <label>Logradouro</label>
        <input type="text" id="post-logradouro" placeholder="Rua, Avenida...">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Bairro</label>
          <input type="text" id="post-bairro" placeholder="Bairro">
        </div>
        <div class="field">
          <label>Cidade</label>
          <input type="text" id="post-cidade" placeholder="Cidade">
        </div>
      </div>
      <div class="field">
        <label>Estado (UF)</label>
        <input type="text" id="post-estado" placeholder="SP" maxlength="2" style="max-width:120px">
      </div>
      <button class="btn btn-post" onclick="doPost()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        CADASTRAR
      </button>
    </div>

    <div class="card">
      <div class="card-title">// Resposta</div>
      <div id="post-status" class="status-line" style="display:none"></div>
      <div id="post-response" class="response-box">Aguardando envio...</div>
    </div>
  </div>

  <!-- DELETE -->
  <div class="panel" id="panel-delete">
    <div class="card">
      <div class="card-title">// Remover CEP</div>
      <div class="field">
        <label>CEP</label>
        <input type="text" id="delete-cep" placeholder="00000-000" maxlength="9">
      </div>
      <button class="btn btn-delete" onclick="doDelete()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        REMOVER
      </button>
    </div>

    <div class="card">
      <div class="card-title">// Resposta</div>
      <div id="delete-status" class="status-line" style="display:none"></div>
      <div id="delete-response" class="response-box">Aguardando operação...</div>
    </div>
  </div>

</div>

<script>
  const API_URL = 'http://localhost/CepApi/api/cep.php';

  // ---- Tabs ----
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // ---- CEP mask ----
  ['get-cep','post-cep','delete-cep'].forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      let v = e.target.value.replace(/\D/g,'').slice(0,8);
      if(v.length > 5) v = v.slice(0,5) + '-' + v.slice(5);
      e.target.value = v;
    });
  });

  function setStatus(id, ok, msg) {
    const el = document.getElementById(id);
    el.style.display = 'flex';
    el.innerHTML = `<span class="status-dot ${ok ? 'ok' : 'err'}"></span><span>${msg}</span>`;
  }

  // ---- GET ----
  async function doGet() {
    const cep = document.getElementById('get-cep').value.trim();
    if (!cep) { alert('Informe um CEP'); return; }

    const card = document.getElementById('get-result-card');
    const rows = document.getElementById('get-result-rows');
    const empty = document.getElementById('get-empty');

    empty.innerHTML = '<span class="spinner"></span> Buscando...';
    card.classList.remove('show');

    try {
      const res = await fetch(`${API_URL}?cep=${encodeURIComponent(cep)}`);
      const data = await res.json();

      if (!data || Object.keys(data).length === 0) {
        setStatus('get-status', false, `HTTP ${res.status} — CEP não encontrado`);
        empty.innerHTML = 'Nenhum resultado encontrado';
        return;
      }

      const labels = { cep:'CEP', logradouro:'Logradouro', bairro:'Bairro', cidade:'Cidade', estado:'Estado' };
      rows.innerHTML = Object.entries(data).map(([k,v]) =>
        `<div class="result-row">
          <span class="result-key">${labels[k] || k}</span>
          <span class="result-val">${v ?? '—'}</span>
        </div>`
      ).join('');

      card.classList.add('show');
      empty.innerHTML = '';
      setStatus('get-status', true, `HTTP ${res.status} — OK`);
    } catch(e) {
      empty.innerHTML = 'Erro na requisição';
      setStatus('get-status', false, 'Erro: ' + e.message);
    }
  }

  // ---- POST ----
  async function doPost() {
    const body = {
      cep:        document.getElementById('post-cep').value.trim(),
      logradouro: document.getElementById('post-logradouro').value.trim(),
      bairro:     document.getElementById('post-bairro').value.trim(),
      cidade:     document.getElementById('post-cidade').value.trim(),
      uf:     document.getElementById('post-estado').value.trim().toUpperCase(),
    };

    const box = document.getElementById('post-response');
    box.className = 'response-box loading';
    box.textContent = 'Enviando...';
    document.getElementById('post-status').style.display = 'none';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      box.className = 'response-box ' + (res.ok ? 'success' : 'error');
      box.textContent = JSON.stringify(data, null, 2);
      setStatus('post-status', res.ok, `HTTP ${res.status} — ${res.ok ? 'Sucesso' : 'Erro'}`);
    } catch(e) {
      box.className = 'response-box error';
      box.textContent = 'Erro: ' + e.message;
      setStatus('post-status', false, 'Falha na requisição');
    }
  }

  // ---- DELETE ----
  async function doDelete() {
    const cep = document.getElementById('delete-cep').value.trim();
    if (!cep) { alert('Informe um CEP'); return; }
    if (!confirm(`Remover o CEP ${cep}?`)) return;

    const box = document.getElementById('delete-response');
    box.className = 'response-box loading';
    box.textContent = 'Removendo...';
    document.getElementById('delete-status').style.display = 'none';

    try {
      const res = await fetch(`${API_URL}?cep=${encodeURIComponent(cep)}`, { method: 'DELETE' });
      const data = await res.json();

      box.className = 'response-box ' + (res.ok ? 'success' : 'error');
      box.textContent = JSON.stringify(data, null, 2);
      setStatus('delete-status', res.ok, `HTTP ${res.status} — ${res.ok ? 'Removido' : 'Erro'}`);
    } catch(e) {
      box.className = 'response-box error';
      box.textContent = 'Erro: ' + e.message;
      setStatus('delete-status', false, 'Falha na requisição');
    }
  }

  // Enter key support
  document.getElementById('get-cep').addEventListener('keydown', e => { if(e.key==='Enter') doGet(); });
  document.getElementById('delete-cep').addEventListener('keydown', e => { if(e.key==='Enter') doDelete(); });
</script>
</body>
</html>
