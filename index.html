<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste API CEP</title>

<style>

body{
    font-family:Arial;
    padding:20px;
}

input,
select,
button{

    width:250px;
    padding:8px;
    margin:5px 0;

}

pre{

    background:#eee;
    padding:15px;

}

</style>

</head>

<body>

<h2>Teste API CEP</h2>

<select id="metodo">

<option value="GET">GET</option>

<option value="POST">POST</option>

<option value="PUT">PUT</option>

<option value="DELETE">DELETE</option>

</select>

<br>

<input
id="cep"
placeholder="CEP">

<br>

<input
id="logradouro"
placeholder="Logradouro">

<br>

<input
id="bairro"
placeholder="Bairro">

<br>

<input
id="cidade"
placeholder="Cidade">

<br>

<input
id="estado"
placeholder="Estado">

<br>

<button onclick="enviar()">

Enviar

</button>

<h3>Resposta:</h3>

<pre id="resultado">

Aguardando...

</pre>

<script>

async function enviar(){

const metodo =
document.getElementById(
'metodo'
).value;

const dados = {

cep:
document.getElementById(
'cep'
).value,

logradouro:
document.getElementById(
'logradouro'
).value,

bairro:
document.getElementById(
'bairro'
).value,

cidade:
document.getElementById(
'cidade'
).value,

estado:
document.getElementById(
'estado'
).value

};

let url =
'http://localhost/api-git/CepApi/api/cep.php';

if(
metodo==="GET" ||
metodo==="DELETE"
){

url +=
'?cep='+
encodeURIComponent(
dados.cep
);

}

const config = {

method:metodo,

headers:{

'Content-Type':
'application/json'

}

};

if(
metodo!=="GET" &&
metodo!=="DELETE"
){

config.body =
JSON.stringify(
dados
);

}

try{

const resposta =
await fetch(
url,
config
);

const texto =
await resposta.text();

try{

const json =
JSON.parse(
texto
);

document
.getElementById(
'resultado'
)
.textContent =
JSON.stringify(
json,
null,
2
);

}
catch{

document
.getElementById(
'resultado'
)
.textContent =
texto;

}

}
catch(erro){

document
.getElementById(
'resultado'
)
.textContent =
erro;

}

}

</script>

</body>
</html>
